name: CI

on:
  push:
    branches: [main, ci/premier-pipeline]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: ./mvnw -B -DskipTests compile

  package-check:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la présence du JAR
        run: ls target/*.jar
